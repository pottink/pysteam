name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run python scripts/generate_protos.py --check
      - run: uv run python scripts/audit_issues.py --check
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build --no-sources
      - run: uv run python scripts/check_wheel.py --python ${{ matrix.python }}

  python-315-preview:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.15
      - run: >-
          uv run --no-project --isolated --python 3.15
          --with cryptography --with httpx --with msgspec --with protobuf
          --with websockets --with zstandard --with filelock --with rich
          --with typer --with pytest --with pytest-asyncio
          python -m pytest -q
