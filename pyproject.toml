[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[project]
name = "pysteam-sdk"
version = "0.1.0a0"
description = "Async Python SDK for Steam authentication, content preservation, and Web API"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "pysteam contributors"}]
keywords = ["steam", "steamkit", "asyncio", "protobuf", "archive", "depot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cryptography>=46",
    "filelock>=3.16,<4",
    "httpx>=0.28.1,<1",
    "msgspec>=0.21.1,<1",
    "protobuf>=7.36,<8",
    "rich>=15,<16",
    "typer>=0.27.2,<1",
    "websockets>=17,<18",
    "zstandard>=0.25,<1",
]

[project.scripts]
pysteam = "pysteam.cli:main"

[project.urls]
Homepage = "https://github.com/pottink/pysteam"
Documentation = "https://github.com/pottink/pysteam#readme"
Issues = "https://github.com/pottink/pysteam/issues"
Source = "https://github.com/pottink/pysteam"

[dependency-groups]
dev = [
    "grpcio-tools>=1.76,<2",
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.13,<1",
    "types-protobuf>=6,<8",
]

[tool.uv.build-backend]
module-name = "pysteam"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["src/pysteam/proto/*", "vendor/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src/pysteam"]
exclude = "src/pysteam/proto/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
